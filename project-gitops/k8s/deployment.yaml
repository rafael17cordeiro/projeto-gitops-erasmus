apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-project-deployment
  labels:
    app: cloud-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-project
  template:
    metadata:
      labels:
        app: cloud-project
    spec:
      containers:
      - name: web-server
        image: rafael17cordeiro/cloud-project-web:v1
        ports:
        - containerPort: 80